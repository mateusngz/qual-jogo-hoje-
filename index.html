<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10111c">
  <meta name="description" content="Seu backlog, sem indecisão. Descubra o jogo certo para o momento e acompanhe sua jornada.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/png" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./styles.css">
  <title>Qual jogo hoje?</title>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div><div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <a class="brand" href="#inicio" aria-label="Qual jogo hoje? Início"><span class="brand-logo">✦</span><span>qual jogo<span class="brand-question">?</span><small>HOJE</small></span></a>
      <p class="nav-caption">SEU ESPAÇO</p>
      <nav class="desktop-nav" aria-label="Seções">
        <button class="nav-link active" data-page="inicio"><span>✧</span> Descobrir</button>
        <button class="nav-link" data-page="biblioteca"><span>▦</span> Biblioteca <b id="nav-count">0</b></button>
        <button class="nav-link" data-page="estatisticas"><span>▥</span> Estatísticas</button>
        <button class="nav-link" data-page="configuracoes"><span>⚙</span> Ajustes</button>
      </nav>
      <div class="sidebar-bottom"><div class="sidebar-hint"><span>✳</span><strong>Menos escolha.<br>Mais diversão.</strong><small>O próximo grande jogo está no seu backlog.</small></div><a href="https://rawg.io/" target="_blank" rel="noopener noreferrer" class="credit">Dados de jogos por <strong>RAWG ↗</strong></a></div>
    </aside>
    <div class="main-column">
      <header class="topbar"><div class="topbar-left"><span class="status-dot"></span><span>SEU HUB DE JOGOS</span></div><div class="topbar-actions"><button id="install-btn" class="install-btn hidden" type="button">↓ Instalar app</button><button class="btn btn-small btn-primary" data-action="add-game" type="button"><span>＋</span> Adicionar jogo</button></div></header>
      <main id="app-content" tabindex="-1" aria-live="polite"></main>
      <footer class="footer"><span>Feito para jogar mais e escolher menos.</span><a href="https://rawg.io/" target="_blank" rel="noopener noreferrer">Dados e capas por RAWG ↗</a></footer>
    </div>
  </div>
  <nav class="mobile-nav" aria-label="Navegação móvel"><button data-page="inicio" class="mobile-link active"><span>✧</span>Descobrir</button><button data-page="biblioteca" class="mobile-link"><span>▦</span>Biblioteca</button><button data-page="estatisticas" class="mobile-link"><span>▥</span>Stats</button><button data-page="configuracoes" class="mobile-link"><span>⚙</span>Ajustes</button></nav>
  <div id="modal-root"></div><div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <script>
    // Migração única do cache antigo do PWA. Preserva jogos e sessões do localStorage.
    (function(){
      const release='qjh-repair-v5';
      if(sessionStorage.getItem(release))return;
      sessionStorage.setItem(release,'1');
      if(!('serviceWorker' in navigator))return;
      Promise.all([
        navigator.serviceWorker.getRegistrations().then(regs=>Promise.all(regs.map(reg=>reg.unregister()))),
        ('caches' in window)?caches.keys().then(keys=>Promise.all(keys.filter(k=>k.startsWith('qual-jogo-hoje-')).map(k=>caches.delete(k)))):Promise.resolve()
      ]).then(()=>{ const u=new URL(location.href);u.searchParams.set('release','5');location.replace(u.href); }).catch(()=>{});
    })();
    // Mesmo com código antigo, um formulário de jogo nunca deve virar parâmetros na URL.
    document.addEventListener('submit',function(e){if(e.target?.id==='game-form')e.preventDefault();},true);
  </script>
  <script src="./config.js"></script>
  <script type="module" src="./js/main.js?release=5"></script>
</body>
</html>
